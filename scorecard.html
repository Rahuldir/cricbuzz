<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<title>Scorecard - Cricbuzz Web</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="index.html" class="logo">
      <span class="logo-mark">CB</span>
      <span class="logo-text">cric<em>buzz</em></span>
    </a>
    <div class="topbar-actions">
      <button class="icon-btn" onclick="history.back()">Back</button>
    </div>
  </div>
</header>

<main id="app" style="max-width:900px;padding:20px 14px;">

  <div id="scorecardLoading" style="text-align:center;padding:60px 20px;color:var(--muted);font-weight:800;">
    Loading scorecard...
  </div>

  <div id="scorecardError" style="display:none;text-align:center;padding:60px 20px;">
    <div style="font-size:40px;margin-bottom:10px;">:(</div>
    <div style="font-weight:800;font-size:15px;margin-bottom:6px;">Could not load match</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:20px;" id="scorecardErrorText"></div>
    <a href="index.html" class="btn-primary" style="display:inline-block;padding:10px 20px;text-decoration:none;">Back to Matches</a>
  </div>

  <div id="scorecardContent" style="display:none;"></div>

</main>

<script src="api.js"></script>
<script src="i18n.js"></script>
<script src="scorecard.js"></script>

</body>
</html>
